name: Sinh bản dịch giao diện (i18n)
# Chạy khi danh sách ngôn ngữ trong scripts/i18n-langs.txt thay đổi (hoặc bấm tay): dịch en.js → <lang>.js, giữ nguyên {biến} & thẻ HTML,
# chỉ dịch khóa mới (bản đã hiệu đính tay được giữ). Máy chủ GitHub truy cập Google Translate ổn định, miễn phí với repo công khai.
on:
  push:
    branches: [main]
    paths: [scripts/i18n-langs.txt, web/js/i18n/en.js]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: i18n
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dịch từng ngôn ngữ
        run: |
          for l in $(grep -v '^#' scripts/i18n-langs.txt); do node scripts/gen-i18n.mjs "$l" || echo "lỗi $l"; sleep 2; done
      - name: Lưu kết quả vào repo
        run: |
          git config user.name "vocaband-bot"
          git config user.email "vocaband-bot@users.noreply.github.com"
          git add web/js/i18n/*.js
          git diff --cached --quiet || (git commit -m "i18n: cập nhật bản dịch giao diện tự động" && git push)
